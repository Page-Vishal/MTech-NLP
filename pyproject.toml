[project]
name = "mtech-nlp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nltk>=3.10.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "spacy>=3.8.13",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.1",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
]
